<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - OPTi-MA</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1f3a5f 0%, #2c5282 60%, #1f3a5f 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #2d3748;
}
.login-box {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 420px;
    padding: 40px 36px 32px;
    position: relative;
    overflow: hidden;
}
.login-box::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, #1f3a5f, #f6ad55, #1f3a5f);
}
.logo {
    text-align: center;
    margin-bottom: 26px;
}
.logo h1 {
    color: #1f3a5f;
    font-size: 2.2rem;
    letter-spacing: 3px;
    font-weight: 700;
}
.logo h1::after {
    content: "";
    display: block;
    width: 60px;
    height: 4px;
    background: #f6ad55;
    margin: 10px auto 0;
    border-radius: 2px;
}
.logo p {
    color: #718096;
    font-size: 0.82rem;
    margin-top: 12px;
    line-height: 1.5;
}
.form-group { margin-bottom: 18px; }
.form-group label {
    display: block;
    font-size: 0.85rem;
    color: #4a5568;
    font-weight: 600;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
}
.form-group input,
.form-group select {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    color: #2d3748;
    background: #f9fafc;
    transition: 0.2s;
}
.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #2c5282;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(44,82,130,0.15);
}
.btn-login {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background: linear-gradient(135deg, #1f3a5f, #2c5282);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: 0.25s;
    font-family: inherit;
    letter-spacing: 0.5px;
}
.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(31,58,95,0.4);
}
.error-msg {
    background: #fed7d7;
    color: #742a2a;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 14px;
    display: none;
    border-left: 4px solid #e53e3e;
}
.error-msg.show { display: block; }
.info-akun {
    margin-top: 22px;
    padding: 14px 16px;
    background: #edf2f7;
    border-radius: 10px;
    font-size: 0.78rem;
    color: #4a5568;
    line-height: 1.7;
    border-left: 4px solid #f6ad55;
}
.info-akun strong { color: #1f3a5f; }
.info-akun code {
    background: #fff;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.78rem;
    color: #2c5282;
    font-weight: 600;
}
</style>
</head>
<body>

<div class="login-box">

    <div class="logo">
        <h1>OPTi-MA</h1>
        <p>Sistem Informasi Pengawasan Operasional<br>dan Pemeliharaan Alat Berat</p>
    </div>

    <div class="error-msg" id="errorMsg">Username atau password salah.</div>

    <form id="loginForm">

        <div class="form-group">
            <label for="role">Login Sebagai</label>
            <select id="role" required>
                <option value="">-- Pilih Role --</option>
                <option value="operator">Operator</option>
                <option value="supervisor">Supervisor</option>
                <option value="mekanik">Mekanik</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Masukkan username" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password" required>
        </div>

        <button type="submit" class="btn-login">Masuk</button>

    </form>

    <div class="info-akun">
        <strong>Akun Demo:</strong><br>
        Operator → <code>operator</code> / <code>123</code><br>
        Supervisor → <code>supervisor</code> / <code>123</code><br>
        Mekanik → <code>mekanik</code> / <code>123</code><br>
        Admin → <code>admin</code> / <code>123</code>
    </div>

</div>

<script>
// ==== DATA USER (hardcoded untuk prototipe) ====
const USERS = {
    operator:   { username: 'operator',   password: '123', nama: 'Andi (Operator)' },
    supervisor: { username: 'supervisor', password: '123', nama: 'Budi (Supervisor)' },
    mekanik:    { username: 'mekanik',    password: '123', nama: 'Citra (Mekanik)' },
    admin:      { username: 'admin',      password: '123', nama: 'Dewi (Admin)' }
};

const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');

form.addEventListener('submit', function (e) {
    e.preventDefault();

    const role = document.getElementById('role').value;
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    const user = USERS[role];

    if (!user || user.username !== username || user.password !== password) {
        errorMsg.textContent = 'Username atau password salah untuk role ' + role + '.';
        errorMsg.classList.add('show');
        return;
    }

    errorMsg.classList.remove('show');

    // Simpan sesi login
    localStorage.setItem('optima_session', JSON.stringify({
        role: role,
        username: user.username,
        nama: user.nama,
        waktu: new Date().toISOString()
    }));

    // Redirect ke dashboard sesuai role
    const redirect = {
        operator:   'dashboard_operator.html',
        supervisor: 'dashboard_supervisor.html',
        mekanik:    'dashboard_mekanik.html',
        admin:      'dashboard_admin.html'
    };

    window.location.href = redirect[role];
});
</script>

</body>
</html>
