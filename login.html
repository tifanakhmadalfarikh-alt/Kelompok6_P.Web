<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OPTi-MA</title>
    <!-- Memanggil file CSS utama -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">

<div class="login-box">

    <div class="logo">
        <h1>OPTi-MA</h1>
        <p>Sistem Informasi Pengawasan Operasional<br>dan Pemeliharaan Alat Berat</p>
    </div>

    <!-- Hapus atribut action="..." dan gunakan id="loginForm" untuk memicu JavaScript -->
    <form id="loginForm">

        <div class="form-group">
            <label for="role">Login Sebagai</label>
            <select id="role" required>
                <option value="">-- Pilih Role --</option>
                <option value="operator">Operator</option>
                <option value="supervisor">Supervisor</option>
                <option value="mekanik">Mekanik</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Masukkan username" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password" required>
        </div>

        <button type="submit" class="btn-login">Masuk</button>

    </form>

    <div class="info-akun">
        <strong>Akun Demo (Tahap Mockup):</strong><br>
        Isian username dan password bebas. Sistem akan mengarahkan Anda sesuai dengan <strong>Role</strong> yang dipilih.
    </div>

</div>

<!-- Skrip pengarah halaman -->
<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        // Mencegah form melakukan refresh halaman (sifat bawaan HTML)
        event.preventDefault();

        // Mengambil nilai role yang dipilih
        const role = document.getElementById('role').value;

        // Mengarahkan ke halaman dashboard yang sesuai di dalam folder 'pages'
        if (role === 'admin') {
            window.location.href = 'pages/dashboard_admin.html';
        } else if (role === 'operator') {
            window.location.href = 'pages/dashboard_operator.html';
        } else if (role === 'supervisor') {
            window.location.href = 'pages/dashboard_supervisor.html';
        } else if (role === 'mekanik') {
            window.location.href = 'pages/dashboard_mekanik.html';
        }
    });
</script>

</body>
</html>
